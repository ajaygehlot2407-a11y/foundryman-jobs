name: Foundryman full monitor - batched

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Monitoring mode
        required: false
        default: full
        type: choice
        options: [full, official-only]
      batch_size:
        description: Sources per batch
        required: false
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  batch:
    name: Source batch ${{ matrix.offset }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        offset: [0, 50, 100, 150]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MONITOR_MODE: ${{ inputs.mode }}
      SOURCE_LIMIT: ${{ inputs.batch_size }}
      SOURCE_OFFSET: ${{ matrix.offset }}
      SOURCE_NAMES: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils curl
      - name: Run source batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          echo "SOURCE_OFFSET=$SOURCE_OFFSET SOURCE_LIMIT=$SOURCE_LIMIT"
          node scripts/monitor-v11.mjs 2>&1 | tee "monitor-output-${SOURCE_OFFSET}.log"
      - name: Show log
        if: always()
        run: cat "monitor-output-${SOURCE_OFFSET}.log" || true
