name: Foundryman vacancy monitor

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = official + aggregators; official-only = official sources only; official-test = controlled test"
        required: false
        default: "full"
      source_limit:
        description: "0 = all active sources"
        required: false
        default: "0"
      source_names:
        description: "Optional comma-separated source-name fragments"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MONITOR_MODE: ${{ inputs.mode || 'full' }}
      SOURCE_LIMIT: ${{ inputs.source_limit || '0' }}
      SOURCE_NAMES: ${{ inputs.source_names || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils curl
      - name: Run V11 targeted monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/monitor-v11.mjs 2>&1 | tee monitor-output.log
      - name: Show log
        if: always()
        run: cat monitor-output.log || true
