name: Foundryman vacancy monitor

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run source monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/monitor-sources.mjs 2>&1 | tee monitor-output.log

      - name: Show complete monitor log
        if: always()
        run: |
          echo "========== COMPLETE MONITOR LOG =========="
          if [ -f monitor-output.log ]; then
            cat monitor-output.log
          else
            echo "monitor-output.log was not created"
          fi
          echo "========== END MONITOR LOG =========="
