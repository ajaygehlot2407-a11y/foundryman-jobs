name: Foundryman network validation
# Controlled classifier validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/monitor-network-validation.yml"
      - "scripts/monitor-v11.mjs"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MONITOR_MODE: official-only
      SOURCE_LIMIT: "0"
      SOURCE_NAMES: "CSIR-CMERI,DGT / Bharat Skills"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils curl
      - name: Run controlled V11 monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/monitor-v11.mjs 2>&1 | tee monitor-output.log
      - name: Show log
        if: always()
        run: cat monitor-output.log || true
